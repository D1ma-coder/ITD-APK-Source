sentry-android = { module = "io.sentry:sentry-android", version = "8.16.0" }
appmetrica-analytics = { module = "io.appmetrica.analytics:analytics", version = "8.0.0" }
timber = { module = "com.jakewharton.timber:timber", version = "5.0.1" }
okhttp-sse = { module = "com.squareup.okhttp3:okhttp-sse", version = "4.12.0" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version = "4.12.0" }
