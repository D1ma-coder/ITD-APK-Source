[versions]
agp = "8.13.2"
kotlin = "2.2.10"
compose = "1.8.2"
material3 = "1.3.2"
activity = "1.8.2"
lifecycle = "2.8.7"
coroutines = "1.10.1"
serialization = "1.9.0"
ktor = "3.1.2"
coil = "2.7.0"

[libraries]
maplibre = { module = "org.maplibre.gl:android-sdk", version = "11.11.0" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version = "1.4.1" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version = "1.4.1" }
androidx-camera-view = { module = "androidx.camera:camera-view", version = "1.4.1" }
androidx-camera-video = { module = "androidx.camera:camera-video", version = "1.4.1" }
androidx-camera-mlkit-vision = { module = "androidx.camera:camera-mlkit-vision", version = "1.4.1" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version = "1.6.0" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version = "1.6.0" }
androidx-media3-transformer = { module = "androidx.media3:media3-transformer", version = "1.6.0" }
androidx-media3-effect = { module = "androidx.media3:media3-effect", version = "1.6.0" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version = "1.4.1" }
