<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Исходники ИТД — Android-клиент на Kotlin и Jetpack Compose">
  <defs>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2979FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2979FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6E56CF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6E56CF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2979FF"/>
      <stop offset="1" stop-color="#7AA7FF"/>
    </linearGradient>
    <clipPath id="logoClip"><rect x="60" y="88" width="104" height="58"/></clipPath>
    <clipPath id="line1"><rect x="60" y="168" width="520" height="70"/></clipPath>
    <clipPath id="line2"><rect x="60" y="238" width="520" height="70"/></clipPath>
    <clipPath id="editorClip"><rect x="562" y="152" width="376" height="206"/></clipPath>
    <clipPath id="phoneScreen"><rect x="918" y="104" width="190" height="326" rx="24"/></clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <path id="logoPath" d="M9,24L15,15H18V29H15V20L9,29H6V15H9V24ZM18,18V15H30V18H26V29H22V18H18ZM27,26H30V33H27V26ZM39,26H42V33H39V26ZM30,26.091H39V29.091H30V26.091ZM37,15H40V26.09H37V15ZM30,15H33V26.34C33,26.34 24.833,28.028 27.556,26.34C30.279,24.652 29.667,19.773 30,15ZM33,15H40L37,18.09H33V15Z"/>
  </defs>

  <style>
    text { font-family: "Inter", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }

    /* one-time intro */
    .logo-stroke { fill: none; stroke: #FFFFFF; stroke-width: .35; stroke-dasharray: 220; stroke-dashoffset: 220;
                   animation: draw 1.6s cubic-bezier(.65,0,.35,1) .1s forwards; }
    .logo-fill   { fill: #FFFFFF; animation: fadeIn .6s ease 1.3s both; }
    .logo-sheen  { animation: sweep 1.2s cubic-bezier(.65,0,.35,1) 1.8s both; }
    .reveal1 { animation: slideUp .9s cubic-bezier(.16,1,.3,1) .5s both; }
    .reveal2 { animation: slideUp .9s cubic-bezier(.16,1,.3,1) .65s both; }
    .sub     { animation: fadeUp .8s cubic-bezier(.16,1,.3,1) 1.0s both; }
    .chips   { animation: fadeUp .8s cubic-bezier(.16,1,.3,1) 1.2s both; }
    .rule    { transform-box: fill-box; transform-origin: left; animation: grow 1.1s cubic-bezier(.65,0,.35,1) .9s both; }
    @keyframes draw    { to { stroke-dashoffset: 0 } }
    @keyframes fadeIn  { from { opacity: 0 } to { opacity: 1 } }
    @keyframes sweep   { from { transform: translateX(-60px) } to { transform: translateX(200px) } }
    @keyframes slideUp { from { transform: translateY(72px) } to { transform: translateY(0) } }
    @keyframes fadeUp  { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes grow    { from { transform: scaleX(0) } to { transform: scaleX(1) } }

    /* ambient light */
    .ambientA { animation: ambA 16s ease-in-out infinite; }
    .ambientB { animation: ambB 20s ease-in-out infinite; }
    @keyframes ambA { 0%,100% { transform: translate(0,0) } 50% { transform: translate(80px,40px) } }
    @keyframes ambB { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-70px,-30px) } }

    /* 10s loop: code -> build -> app */
    .editor { animation: editorLife 10s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes editorLife {
      0%   { opacity: 0; transform: translateY(16px) }
      5%   { opacity: 1; transform: translateY(0) }
      58%  { opacity: 1; transform: translateX(0) }
      66%  { opacity: .3; transform: translateX(-28px) }
      92%  { opacity: .3; transform: translateX(-28px) }
      100% { opacity: 0; transform: translate(-28px,8px) }
    }

    .mask { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .m1 { animation-name: type1 } .m2 { animation-name: type2 } .m3 { animation-name: type3 }
    .m4 { animation-name: type4 } .m5 { animation-name: type5 } .m6 { animation-name: type6 } .m7 { animation-name: type7 }
    @keyframes type1 { 0%,6%  { transform: translateX(0) } 13%,96% { transform: translateX(340px) } 100% { transform: translateX(0) } }
    @keyframes type2 { 0%,13% { transform: translateX(0) } 20%,96% { transform: translateX(340px) } 100% { transform: translateX(0) } }
    @keyframes type3 { 0%,20% { transform: translateX(0) } 24%,96% { transform: translateX(340px) } 100% { transform: translateX(0) } }
    @keyframes type4 { 0%,24% { transform: translateX(0) } 32%,96% { transform: translateX(340px) } 100% { transform: translateX(0) } }
    @keyframes type5 { 0%,32% { transform: translateX(0) } 34%,96% { transform: translateX(340px) } 100% { transform: translateX(0) } }
    @keyframes type6 { 0%,34% { transform: translateX(0) } 36%,96% { transform: translateX(340px) } 100% { transform: translateX(0) } }
    @keyframes type7 { 0%,36% { transform: translateX(0) } 38%,96% { transform: translateX(340px) } 100% { transform: translateX(0) } }

    .caret { animation: caret 10s linear infinite; }
    @keyframes caret {
      0%,6%   { transform: translate(0,0); opacity: 1 }
      13%     { transform: translate(236px,0) }
      13.01%  { transform: translate(14px,22px) }
      20%     { transform: translate(300px,22px) }
      20.01%  { transform: translate(28px,44px) }
      24%     { transform: translate(110px,44px) }
      24.01%  { transform: translate(42px,66px) }
      32%     { transform: translate(256px,66px) }
      32.01%  { transform: translate(28px,88px) }
      34%     { transform: translate(40px,88px) }
      34.01%  { transform: translate(14px,110px) }
      36%     { transform: translate(26px,110px) }
      36.01%  { transform: translate(0,132px) }
      38%     { transform: translate(12px,132px); opacity: 1 }
      42%,100% { transform: translate(12px,132px); opacity: 0 }
    }

    .build { animation: buildLife 10s ease infinite; }
    @keyframes buildLife { 0%,40% { opacity: 0 } 42%,57% { opacity: 1 } 59%,100% { opacity: 0 } }
    .progress { transform-box: fill-box; transform-origin: left; animation: progress 10s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes progress { 0%,42% { transform: scaleX(0) } 56%,100% { transform: scaleX(1) } }
    .done { animation: done 10s ease infinite; }
    @keyframes done { 0%,58% { opacity: 0 } 60%,92% { opacity: 1 } 96%,100% { opacity: 0 } }

    .phone { animation: phoneLife 10s cubic-bezier(.16,1,.3,1) infinite; }
    @keyframes phoneLife {
      0%,58%  { opacity: 0; transform: translateX(70px) }
      68%     { opacity: 1; transform: translateX(0) }
      92%     { opacity: 1; transform: translate(0,-6px) }
      100%    { opacity: 0; transform: translate(0,10px) }
    }
    .ui { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.16,1,.3,1); }
    .u1 { animation-name: ui1 } .u2 { animation-name: ui2 } .u3 { animation-name: ui3 } .u4 { animation-name: ui4 }
    @keyframes ui1 { 0%,63% { opacity: 0; transform: translateY(14px) } 68%,100% { opacity: 1; transform: translateY(0) } }
    @keyframes ui2 { 0%,66% { opacity: 0; transform: translateY(14px) } 71%,100% { opacity: 1; transform: translateY(0) } }
    @keyframes ui3 { 0%,69% { opacity: 0; transform: translateY(14px) } 74%,100% { opacity: 1; transform: translateY(0) } }
    @keyframes ui4 { 0%,61% { opacity: 0; transform: translateY(20px) } 69%,100% { opacity: 1; transform: translateY(0) } }

    .pill { animation: pill 10s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes pill { 0%,76% { transform: translateX(0) } 80%,86% { transform: translateX(44px) } 90%,100% { transform: translateX(132px) } }
    .heart { transform-box: fill-box; transform-origin: center; animation: heart 10s ease infinite; }
    @keyframes heart { 0%,79% { transform: scale(1); fill: #6B6B70 } 81% { transform: scale(1.6); fill: #FF2D55 } 84%,100% { transform: scale(1); fill: #FF2D55 } }
    .count  { animation: count 10s steps(1, end) infinite; }
    .count2 { animation: count2 10s steps(1, end) infinite; }
    @keyframes count  { 0% { opacity: 1 } 80% { opacity: 0 } 100% { opacity: 0 } }
    @keyframes count2 { 0% { opacity: 0 } 80% { opacity: 1 } 100% { opacity: 1 } }
    .badge { transform-box: fill-box; transform-origin: center; animation: badge 10s cubic-bezier(.34,1.56,.64,1) infinite; }
    @keyframes badge { 0%,84% { transform: scale(0) } 88%,100% { transform: scale(1) } }

    @media (prefers-reduced-motion: reduce) {
      .editor, .mask, .caret, .build, .progress, .phone, .ui, .pill, .heart, .badge, .count, .count2, .ambientA, .ambientB { animation: none; }
      .mask, .caret, .build, .count { display: none; }
    }
  </style>

  <!-- backdrop -->
  <rect width="1200" height="480" fill="#08080C"/>
  <rect width="1200" height="480" fill="url(#dots)"/>
  <circle class="ambientA" cx="260" cy="110" r="300" fill="url(#glowA)"/>
  <circle class="ambientB" cx="960" cy="420" r="320" fill="url(#glowB)"/>

  <!-- logo: stroke draw, then fill, then a light sweep -->
  <g transform="translate(60 76) scale(2.2)">
    <use href="#logoPath" class="logo-stroke"/>
    <use href="#logoPath" class="logo-fill"/>
  </g>
  <g clip-path="url(#logoClip)">
    <g transform="translate(60 76) scale(2.2)">
      <g class="logo-sheen"><rect x="0" y="10" width="20" height="30" fill="url(#sheen)" transform="skewX(-18)"/></g>
    </g>
  </g>

  <!-- kinetic title -->
  <g clip-path="url(#line1)">
    <text class="reveal1" x="62" y="222" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Исходники</text>
  </g>
  <g clip-path="url(#line2)">
    <text class="reveal2" x="62" y="290" font-size="58" font-weight="800" fill="#2979FF" letter-spacing="-1.5">приложения ИТД</text>
  </g>
  <rect class="rule" x="64" y="318" width="56" height="3" rx="1.5" fill="#2979FF"/>
  <text class="sub" x="64" y="354" font-size="19" fill="#A1A1AA">Android-клиент итд.com на Kotlin и Jetpack Compose.</text>
  <text class="sub" x="64" y="380" font-size="19" fill="#A1A1AA">Форкните и соберите свой клиент.</text>

  <g class="chips" font-size="13" font-weight="600">
    <rect x="64" y="408" width="78" height="30" rx="15" fill="#2979FF"/>
    <text x="103" y="428" text-anchor="middle" fill="#FFFFFF">v1.1.0</text>
    <rect x="152" y="408" width="88" height="30" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="196" y="428" text-anchor="middle" fill="#D4D4D8">Kotlin</text>
    <rect x="250" y="408" width="98" height="30" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="299" y="428" text-anchor="middle" fill="#D4D4D8">Compose</text>
    <rect x="358" y="408" width="98" height="30" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="407" y="428" text-anchor="middle" fill="#D4D4D8">Android</text>
  </g>

  <!-- code editor -->
  <g class="editor">
    <rect x="560" y="110" width="380" height="250" rx="16" fill="#111116" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="582" cy="132" r="5" fill="#FF5F57"/>
    <circle cx="600" cy="132" r="5" fill="#FEBC2E"/>
    <circle cx="618" cy="132" r="5" fill="#28C840"/>
    <text class="mono" x="750" y="136" font-size="11" fill="#6B6B70" text-anchor="middle">MainActivity.kt</text>
    <line x1="560" y1="150" x2="940" y2="150" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <g clip-path="url(#editorClip)">
    <g class="mono" font-size="13.5">
      <text x="584" y="182"><tspan fill="#CF8E6D">class </tspan><tspan fill="#E2E2E2">MainActivity : </tspan><tspan fill="#7AA7FF">ComponentActivity</tspan><tspan fill="#E2E2E2">() {</tspan></text>
      <text x="598" y="204"><tspan fill="#CF8E6D">override fun </tspan><tspan fill="#56A8F5">onCreate</tspan><tspan fill="#E2E2E2">(state: </tspan><tspan fill="#7AA7FF">Bundle</tspan><tspan fill="#E2E2E2">?) {</tspan></text>
      <text x="612" y="226"><tspan fill="#56A8F5">setContent </tspan><tspan fill="#E2E2E2">{</tspan></text>
      <text x="626" y="248"><tspan fill="#56A8F5">ItdTheme </tspan><tspan fill="#E2E2E2">{ </tspan><tspan fill="#56A8F5">ItdApp</tspan><tspan fill="#E2E2E2">(container) }</tspan></text>
      <text x="612" y="270" fill="#E2E2E2">}</text>
      <text x="598" y="292" fill="#E2E2E2">}</text>
      <text x="584" y="314" fill="#E2E2E2">}</text>
    </g>
    <g fill="#111116">
      <rect class="mask m1" x="582" y="166" width="340" height="22"/>
      <rect class="mask m2" x="596" y="188" width="330" height="22"/>
      <rect class="mask m3" x="610" y="210" width="320" height="22"/>
      <rect class="mask m4" x="624" y="232" width="310" height="22"/>
      <rect class="mask m5" x="610" y="254" width="320" height="22"/>
      <rect class="mask m6" x="596" y="276" width="330" height="22"/>
      <rect class="mask m7" x="582" y="298" width="340" height="22"/>
    </g>
    <rect class="caret" x="584" y="169" width="2" height="17" fill="#2979FF"/>
    </g>
    <g class="build">
      <text class="mono" x="584" y="342" font-size="11.5" fill="#A1A1AA">./gradlew assembleRelease</text>
      <rect x="776" y="334" width="140" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect class="progress" x="776" y="334" width="140" height="6" rx="3" fill="url(#bar)"/>
    </g>
    <text class="done mono" x="584" y="342" font-size="11.5" fill="#28C840">✓ BUILD SUCCESSFUL</text>
  </g>

  <!-- phone -->
  <g class="phone">
    <rect x="906" y="90" width="214" height="354" rx="34" fill="#0B0B0F" stroke="#2C2C32" stroke-width="2"/>
    <rect x="918" y="104" width="190" height="326" rx="24" fill="#000000"/>
    <rect x="990" y="112" width="46" height="10" rx="5" fill="#0B0B0F"/>
    <g clip-path="url(#phoneScreen)">
      <g class="ui u1">
        <g transform="translate(930 128) scale(0.62)" fill="#FFFFFF"><use href="#logoPath"/></g>
        <text x="1094" y="152" font-size="10" fill="#6B6B70" text-anchor="end">Для вас</text>
      </g>
      <g class="ui u2">
        <rect x="928" y="170" width="170" height="104" rx="14" fill="#16161A"/>
        <circle cx="946" cy="190" r="10" fill="#2979FF"/>
        <rect x="962" y="183" width="64" height="7" rx="3.5" fill="#E2E2E2"/>
        <rect x="962" y="194" width="40" height="5" rx="2.5" fill="#6B6B70"/>
        <rect x="938" y="212" width="150" height="6" rx="3" fill="#2C2C32"/>
        <rect x="938" y="224" width="118" height="6" rx="3" fill="#2C2C32"/>
        <path class="heart" d="M946 258c-4-3.4-7-5.8-7-8.8 0-2.2 1.7-3.9 3.8-3.9 1.3 0 2.5.7 3.2 1.7.7-1 1.9-1.7 3.2-1.7 2.1 0 3.8 1.7 3.8 3.9 0 3-3 5.4-7 8.8z" fill="#6B6B70"/>
        <text class="count" x="958" y="257" font-size="10" fill="#6B6B70">41</text>
        <text class="count2" x="958" y="257" font-size="10" fill="#FF2D55">42</text>
      </g>
      <g class="ui u3">
        <rect x="928" y="284" width="170" height="82" rx="14" fill="#16161A"/>
        <circle cx="946" cy="304" r="10" fill="#B3AFFA"/>
        <rect x="962" y="297" width="58" height="7" rx="3.5" fill="#E2E2E2"/>
        <rect x="962" y="308" width="34" height="5" rx="2.5" fill="#6B6B70"/>
        <rect x="938" y="328" width="150" height="28" rx="8" fill="#2979FF" fill-opacity="0.28"/>
      </g>
      <g class="ui u4">
        <rect x="930" y="384" width="166" height="34" rx="17" fill="#1C1C1F" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <rect class="pill" x="934" y="389" width="34" height="24" rx="12" fill="#2C2C32"/>
        <circle cx="951" cy="401" r="4" fill="#FFFFFF"/>
        <circle cx="995" cy="401" r="4" fill="#8A8A90"/>
        <circle cx="1039" cy="401" r="4" fill="#8A8A90"/>
        <circle cx="1083" cy="401" r="4" fill="#8A8A90"/>
        <g class="badge"><circle cx="1045" cy="394" r="5.5" fill="#FF5050"/></g>
      </g>
    </g>
  </g>
</svg>
