<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="ИТД — исходники Android-клиента">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070D"/>
      <stop offset="0.55" stop-color="#11122A"/>
      <stop offset="1" stop-color="#0B1E4A"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#B3D1FF"/>
      <stop offset="1" stop-color="#2979FF"/>
    </linearGradient>
    <linearGradient id="nuksta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B3AFFA"/>
      <stop offset="1" stop-color="#52BEF7"/>
    </linearGradient>
    <radialGradient id="orbBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2979FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2979FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="titleClip"><rect x="80" y="180" width="560" height="72"/></clipPath>
    <clipPath id="screen"><rect x="842" y="70" width="210" height="330" rx="26"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .orb1 { animation: drift1 14s ease-in-out infinite; }
    .orb2 { animation: drift2 18s ease-in-out infinite; }
    .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s } .d4 { animation-delay: .85s }
    .phone { animation: float 6s ease-in-out infinite; transform-origin: 947px 235px; }
    .feed { animation: scroll 9s linear infinite; }
    .ghost { animation: ghost 5s ease-in-out infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 1088px 96px; }
    .shine { animation: shine 5s ease-in-out infinite; }
    @keyframes drift1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(60px,30px) } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-50px,-25px) } }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-3deg) } 50% { transform: translateY(-12px) rotate(-1deg) } }
    @keyframes scroll { from { transform: translateY(0) } to { transform: translateY(-264px) } }
    @keyframes ghost { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-8px,-14px) } }
    @keyframes blink { 50% { opacity: 0 } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.12); opacity: 1 } }
    @keyframes shine { 0% { transform: translateX(-200px) } 60%,100% { transform: translateX(760px) } }
  </style>

  <rect width="1200" height="460" fill="url(#bg)"/>
  <rect width="1200" height="460" fill="url(#grid)"/>
  <circle class="orb1" cx="240" cy="120" r="260" fill="url(#orbBlue)"/>
  <circle class="orb2" cx="960" cy="380" r="280" fill="url(#orbViolet)"/>

  <!-- logo -->
  <g class="rise d1"><g transform="translate(70 70) scale(2.6)" fill="#FFFFFF">
    <path d="M9,24L15,15H18V29H15V20L9,29H6V15H9V24ZM18,18V15H30V18H26V29H22V18H18Z"/>
    <path d="M27,26H30V33H27V26ZM39,26H42V33H39V26ZM30,26.091H39V29.091H30V26.091Z"/>
    <path d="M37,15H40V26.09H37V15ZM30,15H33V26.34C33,26.34 24.833,28.028 27.556,26.34C30.279,24.652 29.667,19.773 30,15Z"/>
    <path d="M33,15H40L37,18.09H33V15Z"/>
  </g></g>

  <g class="rise d2">
    <text x="84" y="236" font-size="64" font-weight="800" fill="url(#title)" letter-spacing="-1">Исходники ИТД</text>
  </g>
  <text class="rise d3" x="86" y="284" font-size="24" fill="#C9D3E8">Android-клиент итд.com на Kotlin и Jetpack Compose</text>
  <text class="rise d3" x="86" y="318" font-size="20" fill="#8C96B0">Основа для своих клиентов и модов<tspan class="blink" fill="#2979FF"> ▍</tspan></text>

  <g class="rise d4" font-size="15" font-weight="600">
    <rect x="86" y="352" width="96" height="34" rx="17" fill="#2979FF"/>
    <text x="134" y="374" text-anchor="middle" fill="#FFFFFF">v1.1.0</text>
    <rect x="194" y="352" width="118" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="253" y="374" text-anchor="middle" fill="#E2E2E2">Kotlin 2.2</text>
    <rect x="324" y="352" width="96" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="372" y="374" text-anchor="middle" fill="#E2E2E2">Compose</text>
    <rect x="432" y="352" width="128" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="496" y="374" text-anchor="middle" fill="#E2E2E2">minSdk 32</text>
  </g>

  <!-- phone -->
  <g class="phone">
    <rect x="830" y="56" width="234" height="358" rx="36" fill="#0A0A0F" stroke="#3A3A40" stroke-width="2"/>
    <rect x="842" y="70" width="210" height="330" rx="26" fill="#000000"/>
    <g clip-path="url(#screen)">
      <g class="feed">
        <g id="cards">
          <g transform="translate(852 92)">
            <rect width="190" height="120" rx="14" fill="#1C1C1C"/>
            <circle cx="22" cy="22" r="11" fill="url(#nuksta)"/>
            <rect x="40" y="14" width="80" height="8" rx="4" fill="#E2E2E2"/>
            <rect x="40" y="27" width="50" height="6" rx="3" fill="#888888"/>
            <rect x="12" y="46" width="166" height="7" rx="3.5" fill="#3A3A3C"/>
            <rect x="12" y="60" width="140" height="7" rx="3.5" fill="#3A3A3C"/>
            <rect x="12" y="76" width="166" height="30" rx="8" fill="#2979FF" fill-opacity="0.35"/>
          </g>
          <g transform="translate(852 224)">
            <rect width="190" height="120" rx="14" fill="#1C1C1C"/>
            <circle cx="22" cy="22" r="11" fill="#FF5050"/>
            <rect x="40" y="14" width="70" height="8" rx="4" fill="#E2E2E2"/>
            <rect x="40" y="27" width="56" height="6" rx="3" fill="#888888"/>
            <rect x="12" y="46" width="160" height="7" rx="3.5" fill="#3A3A3C"/>
            <rect x="12" y="60" width="120" height="7" rx="3.5" fill="#3A3A3C"/>
            <text x="16" y="100" font-size="13" fill="#FF0040">♥</text>
            <text x="32" y="100" font-size="11" fill="#888888">128</text>
          </g>
        </g>
        <use href="#cards" y="264"/>
      </g>
      <rect x="852" y="356" width="190" height="36" rx="18" fill="#1C1C1C" fill-opacity="0.95" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <circle cx="878" cy="374" r="5" fill="#E2E2E2"/>
      <circle cx="922" cy="374" r="5" fill="#888888"/>
      <circle cx="966" cy="374" r="5" fill="#888888"/>
      <circle cx="1010" cy="374" r="5" fill="#888888"/>
    </g>
  </g>

  <!-- halloween ghost -->
  <g transform="translate(1060 120)"><g class="ghost">
    <path d="M0 30 C0 8 16 -4 30 -4 C44 -4 60 8 60 30 V66 L50 58 L40 66 L30 58 L20 66 L10 58 L0 66 Z" fill="#FFFFFF" fill-opacity="0.92"/>
    <circle cx="21" cy="26" r="4.5" fill="#11122A"/>
    <circle cx="39" cy="26" r="4.5" fill="#11122A"/>
    <ellipse cx="30" cy="42" rx="6" ry="4" fill="#11122A"/>
  </g></g>
  <g class="pulse">
    <circle cx="1088" cy="96" r="13" fill="#FF5050"/>
    <text x="1088" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
  </g>
</svg>
