<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Как сделан проект: APK, декомпиляция, перенос файлов, восстановление с ИИ, Android-проект">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0B14"/>
      <stop offset="1" stop-color="#101A33"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2979FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#52BEF7"/>
      <stop offset="1" stop-color="#B3AFFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1E2A"/>
      <stop offset="1" stop-color="#15151E"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .line { stroke-dasharray: 6 10; animation: dash 1.2s linear infinite; }
    .packet { animation: travel 6s cubic-bezier(.45,.05,.55,.95) infinite; }
    .node { animation: pop .7s cubic-bezier(.2,.9,.3,1.3) both; transform-box: fill-box; transform-origin: center; }
    .n1 { animation-delay: .1s } .n2 { animation-delay: .35s } .n3 { animation-delay: .6s } .n4 { animation-delay: .85s } .n5 { animation-delay: 1.1s }
    .glow { animation: glow 6s ease-in-out infinite; }
    .g1 { animation-delay: 0s } .g2 { animation-delay: 1.2s } .g3 { animation-delay: 2.4s } .g4 { animation-delay: 3.6s } .g5 { animation-delay: 4.8s }
    @keyframes dash { to { stroke-dashoffset: -16 } }
    @keyframes travel { from { transform: translateX(0) } to { transform: translateX(960px) } }
    @keyframes pop { from { opacity: 0; transform: scale(.85) } to { opacity: 1; transform: scale(1) } }
    @keyframes glow { 0%,100% { stroke-opacity: .15 } 8%,16% { stroke-opacity: 1 } 30% { stroke-opacity: .15 } }
  </style>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <line class="line" x1="120" y1="132" x2="1080" y2="132" stroke="#3A3A50" stroke-width="3"/>
  <rect class="packet" x="90" y="128" width="120" height="8" rx="4" fill="url(#flow)"/>

  <g font-size="15" text-anchor="middle">
    <g class="node n1">
      <rect class="glow g1" x="50" y="72" width="140" height="120" rx="20" fill="url(#card)" stroke="#2979FF" stroke-width="2"/>
      <text x="120" y="122" font-size="34">📦</text>
      <text x="120" y="160" fill="#FFFFFF" font-weight="700">APK</text>
      <text x="120" y="180" fill="#8C96B0" font-size="12">ИТД 1.1.0</text>
    </g>
    <g class="node n2">
      <rect class="glow g2" x="290" y="72" width="140" height="120" rx="20" fill="url(#card)" stroke="#52BEF7" stroke-width="2"/>
      <text x="360" y="122" font-size="34">🔍</text>
      <text x="360" y="160" fill="#FFFFFF" font-weight="700">Декомпиляция</text>
      <text x="360" y="180" fill="#8C96B0" font-size="12">код и ресурсы</text>
    </g>
    <g class="node n3">
      <rect class="glow g3" x="530" y="72" width="140" height="120" rx="20" fill="url(#card)" stroke="#22C55E" stroke-width="2"/>
      <text x="600" y="122" font-size="34">📁</text>
      <text x="600" y="160" fill="#FFFFFF" font-weight="700">Перенос</text>
      <text x="600" y="180" fill="#8C96B0" font-size="12">как есть</text>
    </g>
    <g class="node n4">
      <rect class="glow g4" x="770" y="72" width="140" height="120" rx="20" fill="url(#card)" stroke="#B3AFFA" stroke-width="2"/>
      <text x="840" y="122" font-size="34">🤖</text>
      <text x="840" y="160" fill="#FFFFFF" font-weight="700">Восстановление</text>
      <text x="840" y="180" fill="#8C96B0" font-size="12">с помощью ИИ</text>
    </g>
    <g class="node n5">
      <rect class="glow g5" x="1010" y="72" width="140" height="120" rx="20" fill="url(#card)" stroke="#F97316" stroke-width="2"/>
      <text x="1080" y="122" font-size="34">🚀</text>
      <text x="1080" y="160" fill="#FFFFFF" font-weight="700">Проект</text>
      <text x="1080" y="180" fill="#8C96B0" font-size="12">собирается в Studio</text>
    </g>
  </g>

  <g font-size="13" fill="#8C96B0" text-anchor="middle">
    <text x="120" y="236">последний релиз</text>
    <text x="360" y="236">jadx + apktool</text>
    <text x="600" y="236">модели, Activity, сервисы</text>
    <text x="840" y="236">обфусцированная логика</text>
    <text x="1080" y="236">функционально идентичен</text>
  </g>
</svg>
