<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="APK, декомпиляция, перенос файлов, восстановление логики, Android-проект">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2979FF" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#2979FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Inter", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .fill { transform-box: fill-box; transform-origin: left; animation: fill 8s cubic-bezier(.65,0,.35,1) infinite; }
    .head { animation: head 8s cubic-bezier(.65,0,.35,1) infinite; }
    .dot { animation-duration: 8s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
    .d0 { animation-name: on0 } .d1 { animation-name: on1 } .d2 { animation-name: on2 } .d3 { animation-name: on3 } .d4 { animation-name: on4 }
    @keyframes fill { 0% { transform: scaleX(0) } 70%,88% { transform: scaleX(1); opacity: 1 } 100% { transform: scaleX(1); opacity: 0 } }
    @keyframes head { 0% { transform: translateX(0) } 70% { transform: translateX(960px); opacity: 1 } 76%,100% { transform: translateX(960px); opacity: 0 } }
    @keyframes on0 { 0%,1%   { fill: #08080C; stroke: #3A3A40 } 3%,88%  { fill: #2979FF; stroke: #2979FF } 100% { fill: #08080C; stroke: #3A3A40 } }
    @keyframes on1 { 0%,17%  { fill: #08080C; stroke: #3A3A40 } 19%,88% { fill: #2979FF; stroke: #2979FF } 100% { fill: #08080C; stroke: #3A3A40 } }
    @keyframes on2 { 0%,34%  { fill: #08080C; stroke: #3A3A40 } 36%,88% { fill: #2979FF; stroke: #2979FF } 100% { fill: #08080C; stroke: #3A3A40 } }
    @keyframes on3 { 0%,52%  { fill: #08080C; stroke: #3A3A40 } 54%,88% { fill: #2979FF; stroke: #2979FF } 100% { fill: #08080C; stroke: #3A3A40 } }
    @keyframes on4 { 0%,69%  { fill: #08080C; stroke: #3A3A40 } 71%,88% { fill: #2979FF; stroke: #2979FF } 100% { fill: #08080C; stroke: #3A3A40 } }
    @media (prefers-reduced-motion: reduce) { .fill, .head, .dot { animation: none } .head { display: none } }
  </style>

  <rect width="1200" height="190" rx="16" fill="#08080C"/>
  <line x1="120" y1="78" x2="1080" y2="78" stroke="#26262B" stroke-width="2"/>
  <rect class="fill" x="120" y="77" width="960" height="2" fill="#2979FF"/>
  <rect class="head" x="60" y="76" width="60" height="4" rx="2" fill="url(#pulse)"/>

  <g stroke-width="2">
    <circle class="dot d0" cx="120" cy="78" r="9" fill="#08080C" stroke="#3A3A40"/>
    <circle class="dot d1" cx="360" cy="78" r="9" fill="#08080C" stroke="#3A3A40"/>
    <circle class="dot d2" cx="600" cy="78" r="9" fill="#08080C" stroke="#3A3A40"/>
    <circle class="dot d3" cx="840" cy="78" r="9" fill="#08080C" stroke="#3A3A40"/>
    <circle class="dot d4" cx="1080" cy="78" r="9" fill="#08080C" stroke="#3A3A40"/>
  </g>

  <g text-anchor="middle">
    <text class="mono" x="120" y="40" font-size="12" fill="#6B6B70">01</text>
    <text class="mono" x="360" y="40" font-size="12" fill="#6B6B70">02</text>
    <text class="mono" x="600" y="40" font-size="12" fill="#6B6B70">03</text>
    <text class="mono" x="840" y="40" font-size="12" fill="#6B6B70">04</text>
    <text class="mono" x="1080" y="40" font-size="12" fill="#6B6B70">05</text>

    <text x="120" y="122" font-size="17" font-weight="600" fill="#F4F4F5">APK</text>
    <text x="360" y="122" font-size="17" font-weight="600" fill="#F4F4F5">Декомпиляция</text>
    <text x="600" y="122" font-size="17" font-weight="600" fill="#F4F4F5">Перенос</text>
    <text x="840" y="122" font-size="17" font-weight="600" fill="#F4F4F5">Восстановление</text>
    <text x="1080" y="122" font-size="17" font-weight="600" fill="#F4F4F5">Проект</text>

    <text x="120" y="148" font-size="13" fill="#8A8A90">последний релиз</text>
    <text x="360" y="148" font-size="13" fill="#8A8A90">код и ресурсы</text>
    <text x="600" y="148" font-size="13" fill="#8A8A90">необфусцированные файлы</text>
    <text x="840" y="148" font-size="13" fill="#8A8A90">обфусцированная логика, ИИ</text>
    <text x="1080" y="148" font-size="13" fill="#8A8A90">собирается в Android Studio</text>
  </g>
</svg>
